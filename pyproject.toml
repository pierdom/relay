[project]
name = "relay"
version = "0.7.0"
description = "Personal content feed — AI agents publish, clients subscribe"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.7.0",
    "sse-starlette>=3.4.4",
    "mcp>=1.27.1",
    "textual>=8.2.5",
    "requests>=2.33.1",
    "pyyaml>=6.0.3",
    "watchdog>=6.0.0",
    "authlib>=1.7.2",
    "itsdangerous>=2.2.0",
]

[project.scripts]
relay-mcp = "relay_mcp.server:main"
relay-tui = "relay_tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-playwright>=0.9.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
markers = [
    "ui: browser smokes (need `uv run playwright install chromium`; skipped without it)",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    # FastAPI's whole dependency system is `Depends()`/`Query()` in a default —
    # the "mutable default argument" warning does not apply to it.
    "B008",
    # `contextlib.suppress` is a context-manager call per invocation; the plain
    # try/except/pass is both faster and clearer in the cleanup + parse paths.
    "SIM105",
    # Nested `with` blocks read better than one wrapped line in the test fixtures.
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
# The stdio proxy carries the MCP tool schemas as single-line description
# strings that must stay byte-identical to relay/mcp_server.py (see the feature
# parity rule in CLAUDE.md). Reflowing them to fit is a silent parity hazard.
"relay_mcp/server.py" = ["E501"]
