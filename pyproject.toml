[project]
name = "relay"
version = "0.1.0"
description = "Personal content feed — AI agents publish, clients subscribe"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.7.0",
    "sse-starlette>=3.4.4",
    "mcp>=1.27.1",
]

[project.scripts]
relay-mcp = "relay_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
