[project]
name = "relay"
version = "0.1.0"
description = "Personal content feed — AI agents publish, clients subscribe"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.7.0",
    "sse-starlette>=3.4.4",
    "mcp>=1.27.1",
    "textual>=8.2.5",
    "requests>=2.33.1",
    "pyyaml>=6.0.3",
    "watchdog>=6.0.0",
    "authlib>=1.7.2",
    "itsdangerous>=2.2.0",
]

[project.scripts]
relay-mcp = "relay_mcp.server:main"
relay-tui = "relay_tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
