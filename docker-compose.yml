services:
  relay:
    container_name: relay
    # Pinned to the current minor line so `docker compose pull` rolls forward
    # within 1.6.x (deliberate, rollback-able) instead of tracking whatever last
    # hit main via :latest. Pin to an exact :1.6.N to freeze. CI publishes
    # :X.Y.Z + :X.Y on every vX.Y.Z tag; this line moves with each minor release.
    image: ghcr.io/pierdom/relay:1.7
    # Run as your host user so files relay writes into the bind-mounted vault
    # (renames, index.db) stay user-owned — good for backup/Syncthing/Obsidian.
    user: "${RELAY_UID:-1000}:${RELAY_GID:-1000}"
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Host vault dir -> container. In production set RELAY_VAULT_DIR in .env to
      # an absolute host path; defaults to ./vault for local dev.
      - ${RELAY_VAULT_DIR:-./vault}:/data/vault
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # Hardening: the process needs no capabilities, must never gain privileges,
    # and writes only into the vault volume (plus /tmp for Python's tempfile).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
