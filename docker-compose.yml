services:
  relay:
    container_name: relay
    image: ghcr.io/pierdom/relay:latest
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - relay_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  relay_data:
