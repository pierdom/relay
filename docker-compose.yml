services:
  relay:
    container_name: relay
    # Pinned to the 0.1 minor line so `docker compose pull` rolls forward within
    # 0.2.x (deliberate, rollback-able) instead of tracking whatever last hit
    # main via :latest. Pin to an exact :0.2.N to freeze, or bump to :0.3 on a
    # minor release. CI publishes :X.Y.Z + :X.Y on every vX.Y.Z tag.
    image: ghcr.io/pierdom/relay:0.2
    # Run as your host user so files relay writes into the bind-mounted vault
    # (renames, index.db) stay user-owned — good for backup/Syncthing/Obsidian.
    user: "${RELAY_UID:-1000}:${RELAY_GID:-1000}"
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Host vault dir -> container. In production set RELAY_VAULT_DIR in .env to
      # an absolute host path; defaults to ./vault for local dev.
      - ${RELAY_VAULT_DIR:-./vault}:/data/vault
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
