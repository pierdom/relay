<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Relay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #090a0d;
      --surface:     #0f1116;
      --border:      #1d2230;
      --text:        #d8dde8;
      --muted:       #4a5568;
      --accent:      #f59e0b;
      --accent-dim:  #d97706;
      --accent-glow: rgba(245, 158, 11, 0.10);
      --tag-bg:      #141208;
      --tag-active:  #231a05;
      --green:       #10b981;
      --red:         #f87171;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
    }

    body {
      background: var(--bg); color: var(--text);
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────── */
    header {
      display: flex; align-items: center; gap: 14px;
      padding: 0 20px; height: 48px;
      border-bottom: 1px solid var(--border);
      background: var(--surface); flex-shrink: 0;
    }
    .brand-name {
      font-size: 11px; font-weight: 600; color: var(--accent);
      letter-spacing: 0.3em; text-transform: uppercase;
    }
    .brand-sep { color: var(--border); font-weight: 300; font-size: 18px; line-height: 1; }

    .live-indicator { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .live-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0; transition: background 0.3s, box-shadow 0.3s;
    }
    .live-dot.connected { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .live-dot.error     { background: var(--red); }
    .live-label {
      font-size: 10px; color: var(--muted); letter-spacing: 0.1em;
      text-transform: uppercase; transition: color 0.3s;
    }
    .live-dot.connected ~ .live-label { color: var(--green); }
    .live-dot.error     ~ .live-label { color: var(--red); }

    .header-right { display: flex; align-items: center; gap: 10px; margin-left: auto; }

    .key-wrap { display: flex; align-items: center; gap: 6px; }
    .key-wrap input {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 5px 10px; border-radius: 4px; font-size: 12px; width: 220px;
      font-family: inherit; letter-spacing: 0.04em; transition: border-color 0.15s;
    }
    .key-wrap input:focus  { outline: none; border-color: var(--accent); }
    .key-wrap input::placeholder { color: var(--muted); }

    .btn-connect {
      background: var(--accent); border: none; color: #000;
      padding: 5px 12px; border-radius: 4px; cursor: pointer;
      font-family: inherit; font-size: 11px; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      transition: background 0.15s;
    }
    .btn-connect:hover { background: var(--accent-dim); }

    .connected-bar { display: flex; align-items: center; }
    .disconnect-btn {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-family: inherit; font-size: 11px; letter-spacing: 0.04em;
      padding: 3px 0; border-bottom: 1px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .disconnect-btn:hover { color: var(--text); border-color: var(--border); }

    .btn-new-post {
      background: var(--accent); border: none; color: #000;
      padding: 5px 12px; border-radius: 4px; cursor: pointer;
      font-family: inherit; font-size: 11px; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      transition: background 0.15s;
    }
    .btn-new-post:hover { background: var(--accent-dim); }

    /* ── Layout ──────────────────────────────────────────── */
    .layout { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ─────────────────────────────────────────── */
    aside {
      width: 220px; flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
      background: var(--bg);
    }
    .sidebar-header {
      padding: 14px 16px 10px;
      font-size: 9px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.18em;
      display: flex; align-items: center; justify-content: space-between;
    }
    .sidebar-add-btn {
      background: none; border: 1px solid var(--border); color: var(--muted);
      cursor: pointer; font-size: 14px; line-height: 1; padding: 1px 6px;
      border-radius: 3px; font-family: inherit;
      transition: border-color 0.15s, color 0.15s;
    }
    .sidebar-add-btn:hover { border-color: var(--accent); color: var(--accent); }

    .tag-new { padding: 0 12px 10px; }
    .tag-new-input {
      background: var(--surface); border: 1px solid var(--accent); color: var(--text);
      border-radius: 3px; font-size: 12px; padding: 4px 8px; width: 100%;
      outline: none; font-family: inherit;
    }

    .tag-list { overflow-y: auto; flex: 1; padding-bottom: 8px; }
    .tag-list::-webkit-scrollbar { width: 3px; }
    .tag-list::-webkit-scrollbar-track { background: transparent; }
    .tag-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .tag-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 16px; cursor: pointer;
      border-left: 2px solid transparent;
      transition: background 0.12s;
    }
    .tag-item:hover  { background: rgba(255,255,255,0.02); }
    .tag-item.active { background: var(--tag-active); border-left-color: var(--accent); }

    .tag-name  { font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tag-count {
      font-size: 9px; color: var(--muted);
      background: var(--border); padding: 1px 5px; border-radius: 8px;
      flex-shrink: 0; font-variant-numeric: tabular-nums;
      transition: background 0.12s, color 0.12s;
    }
    .tag-item.active .tag-count { background: var(--accent); color: #000; }

    .tag-rename {
      background: none; border: none; cursor: pointer;
      padding: 0 1px; font-size: 10px; opacity: 0; flex-shrink: 0;
      transition: opacity 0.12s; line-height: 1;
    }
    .tag-item:hover .tag-rename { opacity: 0.6; }
    .tag-rename:hover { opacity: 1 !important; }

    .tag-rename-input {
      background: var(--bg); border: 1px solid var(--accent); color: var(--text);
      border-radius: 3px; font-size: 12px; padding: 1px 5px;
      width: 100%; outline: none; font-family: inherit;
    }

    /* ── Feed ────────────────────────────────────────────── */
    main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .compose-panel {
      overflow: hidden; max-height: 0; opacity: 0;
      transition: max-height 0.28s ease, opacity 0.2s ease, padding 0.28s ease;
      padding: 0 20px;
    }
    .compose-panel.open { max-height: 660px; opacity: 1; padding: 16px 20px 0; }
    .compose-panel .post { border-style: dashed; border-color: rgba(245,158,11,0.4); }

    .feed {
      flex: 1; overflow-y: auto;
      padding: 16px 20px; display: flex; flex-direction: column; gap: 10px;
    }
    .feed::-webkit-scrollbar { width: 4px; }
    .feed::-webkit-scrollbar-track { background: transparent; }
    .feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Post card ───────────────────────────────────────── */
    .post {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; padding: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
      animation: cardIn 0.3s ease both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .post:hover { border-color: #2d3348; box-shadow: 0 4px 24px rgba(0,0,0,0.35); }
    .post.new { animation: cardIn 0.3s ease, flash 1.4s ease; }
    @keyframes flash {
      0%   { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 24px var(--accent-glow); }
      100% { border-color: var(--border); box-shadow: none; }
    }

    .post-header { margin-bottom: 10px; }
    .post-title  { font-size: 13px; font-weight: 600; color: var(--text); display: block; margin-bottom: 6px; }

    .post-tags { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
    .tag-pill {
      font-size: 10px; padding: 2px 7px; border-radius: 3px;
      background: var(--tag-bg); color: var(--accent); cursor: pointer;
      border: 1px solid rgba(245,158,11,0.2); letter-spacing: 0.02em;
      transition: background 0.12s;
    }
    .tag-pill:hover { background: var(--tag-active); }
    .post-source { font-size: 10px; color: var(--muted); }

    .post-body { color: #b8bfcc; line-height: 1.72; font-size: 13px; }
    .post-body.format-text { white-space: pre-wrap; font-size: 12px; }
    .post-body.format-json {
      white-space: pre-wrap; font-size: 11px;
      background: var(--bg); padding: 10px 12px;
      border-radius: 4px; border: 1px solid var(--border);
    }
    .post-body h1, .post-body h2, .post-body h3 { color: var(--text); margin: 14px 0 6px; font-weight: 600; }
    .post-body h1 { font-size: 14px; }
    .post-body h2 { font-size: 13px; }
    .post-body h3 { font-size: 12px; }
    .post-body p         { margin: 6px 0; }
    .post-body ul, .post-body ol { padding-left: 18px; margin: 6px 0; }
    .post-body li        { margin: 3px 0; }
    .post-body a         { color: var(--accent); text-decoration: none; }
    .post-body a:hover   { text-decoration: underline; }
    .post-body code      { background: var(--bg); padding: 1px 5px; border-radius: 3px; font-size: 11px; border: 1px solid var(--border); }
    .post-body pre       { background: var(--bg); padding: 10px 12px; border-radius: 4px; overflow-x: auto; margin: 8px 0; border: 1px solid var(--border); }
    .post-body pre code  { background: none; padding: 0; border: none; font-size: 11px; }
    .post-body blockquote { border-left: 2px solid var(--accent); padding-left: 12px; color: var(--muted); margin: 8px 0; }
    .post-body strong    { color: var(--text); font-weight: 600; }
    .post-body em        { font-style: italic; color: #c4cad8; }

    .post-footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border);
    }
    .post-time { font-size: 10px; color: var(--muted); letter-spacing: 0.02em; }
    .post-actions { display: flex; gap: 6px; opacity: 0; transition: opacity 0.15s; }
    .post:hover .post-actions { opacity: 1; }

    .btn-delete {
      background: none; border: 1px solid rgba(248,113,113,0.25); color: var(--red);
      padding: 3px 9px; border-radius: 3px; cursor: pointer;
      font-family: inherit; font-size: 11px;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-delete:hover { background: rgba(248,113,113,0.1); border-color: var(--red); }

    .btn-edit {
      background: none; border: 1px solid var(--border); color: var(--muted);
      padding: 3px 9px; border-radius: 3px; cursor: pointer;
      font-family: inherit; font-size: 11px;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-edit:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Edit / Compose form ─────────────────────────────── */
    .edit-form { display: flex; flex-direction: column; gap: 10px; }
    .edit-form input, .edit-form textarea, .edit-form select {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 7px 10px; border-radius: 4px; font-size: 12px; font-family: inherit; width: 100%;
      transition: border-color 0.15s;
    }
    .edit-form textarea       { resize: vertical; min-height: 120px; line-height: 1.65; }
    .edit-form input:focus,
    .edit-form textarea:focus,
    .edit-form select:focus   { outline: none; border-color: var(--accent); }
    .edit-form label {
      font-size: 9px; color: var(--muted); margin-bottom: 3px;
      display: block; text-transform: uppercase; letter-spacing: 0.12em;
    }
    .edit-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 2px; }

    .btn-save {
      background: var(--accent); border: none; color: #000;
      padding: 5px 14px; border-radius: 3px; cursor: pointer;
      font-family: inherit; font-size: 11px; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      transition: background 0.15s;
    }
    .btn-save:hover { background: var(--accent-dim); }

    .btn-cancel {
      background: none; border: 1px solid var(--border); color: var(--muted);
      padding: 5px 14px; border-radius: 3px; cursor: pointer;
      font-family: inherit; font-size: 11px;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-cancel:hover { border-color: var(--text); color: var(--text); }

    /* ── Load more / states ──────────────────────────────── */
    .load-more { text-align: center; padding: 14px 20px; }
    .load-more button {
      background: none; border: 1px solid var(--border); color: var(--muted);
      padding: 7px 20px; border-radius: 4px; cursor: pointer;
      font-family: inherit; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      transition: border-color 0.15s, color 0.15s;
    }
    .load-more button:hover { border-color: var(--accent); color: var(--accent); }

    .empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--muted); padding: 64px 16px; gap: 14px; flex: 1;
    }
    .empty svg { opacity: 0.25; }
    .empty p   { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }

    .auth-prompt {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--muted); padding: 64px 16px; gap: 8px;
    }
    .auth-prompt p        { font-size: 12px; }
    .auth-prompt p + p    { font-size: 11px; opacity: 0.6; margin-top: 4px; }

    /* ── Responsive ──────────────────────────────────────── */

    /* iOS dynamic viewport height */
    @supports (height: 100dvh) { body { height: 100dvh; } }

    /* Hamburger button — desktop hidden */
    .menu-btn {
      display: none; background: none; border: none; cursor: pointer;
      flex-direction: column; justify-content: space-between;
      width: 18px; height: 12px; padding: 0; flex-shrink: 0;
    }
    .menu-btn span {
      display: block; width: 100%; height: 1.5px;
      background: var(--muted); border-radius: 1px; transition: background 0.15s;
    }
    .menu-btn:hover span, .menu-btn.active span { background: var(--accent); }

    /* Sidebar overlay */
    .sidebar-overlay {
      display: none; position: fixed; inset: 0; z-index: 49;
      background: rgba(0,0,0,0.6);
      -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    }
    .sidebar-overlay.visible { display: block; }

    @media (max-width: 768px) {
      /* Header */
      header { padding: 0 14px; gap: 10px; }
      .menu-btn { display: flex; }
      .brand-sep { display: none; }
      .live-label { display: none; }
      .key-wrap input { width: 140px; }
      .btn-new-post { font-size: 10px; padding: 5px 9px; letter-spacing: 0.06em; }

      /* Sidebar → slide-in drawer */
      aside {
        position: fixed; top: 48px; left: 0; bottom: 0; z-index: 50;
        width: 260px;
        transform: translateX(-100%);
        transition: transform 0.24s cubic-bezier(0.4,0,0.2,1);
        box-shadow: 8px 0 40px rgba(0,0,0,0.6);
      }
      aside.open { transform: translateX(0); }

      /* Feed — full width, tighter spacing */
      .feed { padding: 12px; gap: 8px; }
      .compose-panel { padding: 0 12px; }
      .compose-panel.open { padding: 12px 12px 0; }
      .post { padding: 12px; }
      .load-more { padding: 10px 12px; }
    }

    /* Touch devices: always show post actions (no hover) */
    @media (hover: none) {
      .post-actions { opacity: 1; }
    }

    @media (max-width: 400px) {
      header { gap: 8px; }
      .key-wrap input { width: 110px; font-size: 11px; }
      .btn-connect, .btn-new-post { padding: 5px 8px; }
    }

    /* ── Post expires label ──────────────────────────────── */
    .post-expires {
      font-size: 10px; color: var(--accent-dim); letter-spacing: 0.02em;
      margin-left: 8px;
    }

    /* ── Tag config inline form ──────────────────────────── */
    .tag-config-form {
      padding: 4px 12px 8px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .tag-config-form input {
      background: var(--bg); border: 1px solid var(--accent); color: var(--text);
      border-radius: 3px; font-size: 11px; padding: 3px 6px; width: 100%;
      outline: none; font-family: inherit;
    }
    .tag-config-btn {
      background: none; border: none; cursor: pointer;
      padding: 0 1px; font-size: 10px; opacity: 0; flex-shrink: 0;
      transition: opacity 0.12s; line-height: 1;
    }
    .tag-item:hover .tag-config-btn { opacity: 0.6; }
    .tag-config-btn:hover { opacity: 1 !important; }

    /* ── Card truncation ─────────────────────────────────── */
    .post:not(.editing) { cursor: pointer; }
    .post-body-wrap { position: relative; max-height: 72px; overflow: hidden; }
    .post-body-wrap::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0;
      height: 36px;
      background: linear-gradient(transparent, var(--surface));
      pointer-events: none;
    }
    .post.editing .post-body-wrap { max-height: none; overflow: visible; }
    .post.editing .post-body-wrap::after { display: none; }

    /* ── Post modal ──────────────────────────────────────── */
    .post-modal { display: none; position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; }
    .post-modal.open { display: flex; }

    .pm-backdrop {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      cursor: pointer;
    }
    .pm-inner {
      position: relative; z-index: 1;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; width: 92%; max-width: 760px; max-height: 88vh;
      display: flex; flex-direction: column;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6);
      animation: modalIn 0.18s ease both;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to   { opacity: 1; transform: none; }
    }
    .pm-header {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 20px 20px 0; flex-shrink: 0;
    }
    .pm-title { flex: 1; font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.4; }
    .pm-close {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 22px; line-height: 1; padding: 0; margin-top: -2px; flex-shrink: 0;
      font-family: inherit; transition: color 0.15s;
    }
    .pm-close:hover { color: var(--text); }
    .pm-meta { padding: 10px 20px 0; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
    .pm-time { font-size: 10px; color: var(--muted); letter-spacing: 0.02em; }
    .pm-body {
      flex: 1; overflow-y: auto; padding: 16px 20px;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    .pm-body::-webkit-scrollbar { width: 4px; }
    .pm-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .pm-footer {
      display: flex; gap: 8px; justify-content: flex-end;
      padding: 12px 20px; border-top: 1px solid var(--border); flex-shrink: 0;
    }
    @media (max-width: 768px) {
      .pm-inner { width: 100%; max-width: 100%; max-height: 100vh; border-radius: 0; }
      .post-modal.open { align-items: flex-end; }
      .pm-inner { animation: modalInMobile 0.22s ease both; }
      @keyframes modalInMobile {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: none; }
      }
    }
  </style>
</head>
<body>

<header>
  <h1 class="brand-name">Relay</h1>
  <span class="brand-sep">·</span>
  <div class="live-indicator">
    <span class="live-dot" id="liveDot"></span>
    <span class="live-label" id="liveLabel">offline</span>
  </div>
  <button class="menu-btn" id="menuBtn" aria-label="Toggle tags">
    <span></span><span></span><span></span>
  </button>
  <div class="header-right">
    <button class="btn-new-post" id="newPostBtn" style="display:none">+ New Post</button>
    <div class="key-wrap">
      <input type="password" id="apiKeyInput" placeholder="API key" autocomplete="off">
      <button class="btn-connect" id="connectBtn">Connect</button>
    </div>
    <div class="connected-bar" id="connectedBar" style="display:none">
      <button class="disconnect-btn" id="disconnectBtn">disconnect</button>
    </div>
  </div>
</header>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="layout">
  <aside id="sidebarEl">
    <div class="sidebar-header">
      Tags
      <button class="sidebar-add-btn" id="newTagBtn" title="New tag" style="display:none">+</button>
    </div>
    <div class="tag-new" id="tagNew" style="display:none">
      <input class="tag-new-input" id="tagNewInput" placeholder="tag name" autocomplete="off">
    </div>
    <div class="tag-list" id="tagList"></div>
  </aside>

  <main>
    <div class="compose-panel" id="composePanel">
      <div class="post">
        <div class="edit-form">
          <div><label>Title</label><input type="text" id="cpTitle" placeholder="(optional)"></div>
          <div>
            <label>Format</label>
            <select id="cpFormat">
              <option value="markdown">markdown</option>
              <option value="text">text</option>
              <option value="html">html</option>
              <option value="json">json</option>
            </select>
          </div>
          <div><label>Content</label><textarea id="cpContent" placeholder="Write something…"></textarea></div>
          <div><label>Tags</label><input type="text" id="cpTags" placeholder="comma-separated"></div>
          <div><label>Source</label><input type="text" id="cpSource" placeholder="(optional)"></div>
          <div><label>Expires</label><input type="datetime-local" id="cpExpires"></div>
          <div class="edit-actions">
            <button class="btn-cancel" id="cpCancel">Cancel</button>
            <button class="btn-save" id="cpPublish">Publish</button>
          </div>
        </div>
      </div>
    </div>

    <div class="feed" id="feed"></div>

    <div class="load-more" id="loadMore" style="display:none">
      <button id="loadMoreBtn">Load more</button>
    </div>
  </main>
</div>

<div class="post-modal" id="postModal">
  <div class="pm-backdrop" id="pmBackdrop"></div>
  <div class="pm-inner">
    <div class="pm-header">
      <span class="pm-title" id="pmTitle"></span>
      <button class="pm-close" id="pmClose">×</button>
    </div>
    <div class="pm-meta" id="pmMeta"></div>
    <div class="pm-body" id="pmBody"></div>
    <div class="pm-footer">
      <button class="btn-edit" id="pmEdit">✏️ Edit</button>
      <button class="btn-delete" id="pmDelete">🗑️ Delete</button>
    </div>
  </div>
</div>

<script>
const LIMIT = 20;
let apiKey = localStorage.getItem('relay_api_key') || '';
let activeTag = null;
let offset = 0;
let total = 0;
let es = null;
let sseErrorTimer = null;

const feed         = document.getElementById('feed');
const tagList      = document.getElementById('tagList');
const loadMoreWrap = document.getElementById('loadMore');
const loadMoreBtn  = document.getElementById('loadMoreBtn');
const liveDot      = document.getElementById('liveDot');
const liveLabel    = document.getElementById('liveLabel');
const apiKeyInput  = document.getElementById('apiKeyInput');
const connectBtn   = document.getElementById('connectBtn');
const newPostBtn   = document.getElementById('newPostBtn');
const composePanel = document.getElementById('composePanel');
const newTagBtn    = document.getElementById('newTagBtn');
const tagNewWrap   = document.getElementById('tagNew');
const tagNewInput  = document.getElementById('tagNewInput');
const connectedBar    = document.getElementById('connectedBar');
const disconnectBtn   = document.getElementById('disconnectBtn');
const menuBtn         = document.getElementById('menuBtn');
const sidebarEl       = document.getElementById('sidebarEl');
const sidebarOverlay  = document.getElementById('sidebarOverlay');

function openSidebar()  { sidebarEl.classList.add('open'); sidebarOverlay.classList.add('visible'); menuBtn.classList.add('active'); }
function closeSidebar() { sidebarEl.classList.remove('open'); sidebarOverlay.classList.remove('visible'); menuBtn.classList.remove('active'); }
menuBtn.addEventListener('click', () => sidebarEl.classList.contains('open') ? closeSidebar() : openSidebar());
sidebarOverlay.addEventListener('click', closeSidebar);

if (apiKey) { apiKeyInput.value = apiKey; init(); }

connectBtn.addEventListener('click', () => {
  const val = apiKeyInput.value.trim();
  if (!val) return;
  apiKey = val;
  localStorage.setItem('relay_api_key', apiKey);
  init();
});

apiKeyInput.addEventListener('keydown', e => { if (e.key === 'Enter') connectBtn.click(); });

disconnectBtn.addEventListener('click', () => {
  apiKey = '';
  localStorage.removeItem('relay_api_key');
  if (es) { es.close(); es = null; }
  if (sseErrorTimer) { clearTimeout(sseErrorTimer); sseErrorTimer = null; }
  closeSidebar();
  closeCompose();
  feed.innerHTML = '';
  tagList.innerHTML = '';
  loadMoreWrap.style.display = 'none';
  newPostBtn.style.display = 'none';
  newTagBtn.style.display = 'none';
  document.querySelector('.key-wrap').style.display = '';
  connectedBar.style.display = 'none';
  apiKeyInput.value = '';
  setDot('');
});

async function apiFetch(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { Authorization: `Bearer ${apiKey}`, 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}

async function init() {
  offset = 0; total = 0;
  feed.innerHTML = '';
  loadMoreWrap.style.display = 'none';
  document.querySelector('.key-wrap').style.display = 'none';
  connectedBar.style.display = '';
  newPostBtn.style.display = '';
  newTagBtn.style.display = '';
  await Promise.all([loadTags(), loadPosts(true)]);
  setDot('connected');
  connectSSE();
}

/* ── Compose ──────────────────────────────────────────────── */
newPostBtn.addEventListener('click', () => {
  if (composePanel.classList.contains('open')) {
    closeCompose();
  } else {
    composePanel.classList.add('open');
    if (activeTag) document.getElementById('cpTags').value = activeTag;
    document.getElementById('cpContent').focus();
  }
});

document.getElementById('cpCancel').addEventListener('click', closeCompose);

document.getElementById('cpPublish').addEventListener('click', async () => {
  const content = document.getElementById('cpContent').value.trim();
  if (!content) return;
  const body = {
    title:  document.getElementById('cpTitle').value.trim() || null,
    content,
    format: document.getElementById('cpFormat').value,
    tags:   document.getElementById('cpTags').value.split(',').map(s => s.trim()).filter(Boolean),
    source: document.getElementById('cpSource').value.trim() || null,
    expires_at: toUtcIso(document.getElementById('cpExpires').value) || null,
  };
  try {
    await apiFetch('/posts', { method: 'POST', body: JSON.stringify(body) });
    closeCompose();
    await loadTags();
  } catch (e) { alert(`Publish failed: ${e.message}`); }
});

function closeCompose() {
  composePanel.classList.remove('open');
  ['cpTitle', 'cpContent', 'cpTags', 'cpSource'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('cpFormat').value = 'markdown';
  document.getElementById('cpExpires').value = '';
}

/* ── New tag ──────────────────────────────────────────────── */
newTagBtn.addEventListener('click', () => {
  const visible = tagNewWrap.style.display !== 'none';
  tagNewWrap.style.display = visible ? 'none' : '';
  if (!visible) { tagNewInput.value = ''; tagNewInput.focus(); }
});

tagNewInput.addEventListener('keydown', async e => {
  if (e.key === 'Escape') { tagNewWrap.style.display = 'none'; return; }
  if (e.key !== 'Enter') return;
  const name = tagNewInput.value.trim().toLowerCase();
  if (!name) return;
  try {
    await apiFetch(`/tags/${encodeURIComponent(name)}/config`, {
      method: 'POST', body: JSON.stringify({}),
    });
    tagNewWrap.style.display = 'none';
    await loadTags();
  } catch (e) { alert(`Failed: ${e.message}`); }
});

/* ── Tags ─────────────────────────────────────────────────── */
async function loadTags() {
  try { const data = await apiFetch('/tags'); renderTags(data.tags); } catch {}
}

function renderTags(tags) {
  tagList.innerHTML = '';
  tagList.appendChild(makeTagItem('all', null, tags.reduce((s, t) => s + t.count, 0)));
  tags.forEach(t => tagList.appendChild(makeTagItem(t.tag, t.tag, t.count)));
}

function makeTagItem(label, value, count) {
  const el = document.createElement('div');
  el.className = 'tag-item' + (activeTag === value ? ' active' : '');
  const renameBtn = value !== null ? `<button class="tag-rename" title="Rename">✏︎</button>` : '';
  const configBtn = value !== null ? `<button class="tag-config-btn" title="Configure">⚙</button>` : '';
  el.innerHTML = `<span class="tag-name">${label}</span>${renameBtn}${configBtn}<span class="tag-count">${count}</span>`;
  el.addEventListener('click', () => selectTag(value));
  if (value !== null) {
    el.querySelector('.tag-rename').addEventListener('click', e => {
      e.stopPropagation();
      startTagRename(el, value);
    });
    el.querySelector('.tag-config-btn').addEventListener('click', e => {
      e.stopPropagation();
      startTagConfig(el, value);
    });
  }
  return el;
}

function startTagRename(el, oldName) {
  const nameSpan = el.querySelector('.tag-name');
  const input = document.createElement('input');
  input.className = 'tag-rename-input';
  input.value = oldName;
  nameSpan.replaceWith(input);
  input.focus(); input.select();

  let committed = false;
  async function commit() {
    if (committed) return; committed = true;
    const newName = input.value.trim().toLowerCase();
    if (!newName || newName === oldName) { cancelRename(); return; }
    try {
      const data = await apiFetch(`/tags/${encodeURIComponent(oldName)}`, {
        method: 'PATCH', body: JSON.stringify({ new_name: newName }),
      });
      if (activeTag === oldName) activeTag = newName;
      renderTags(data.tags);
    } catch (e) { alert(`Rename failed: ${e.message}`); cancelRename(); }
  }

  function cancelRename() {
    committed = true;
    const span = document.createElement('span');
    span.className = 'tag-name'; span.textContent = oldName;
    input.replaceWith(span);
  }

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    if (e.key === 'Escape') cancelRename();
  });
  input.addEventListener('blur', commit);
}

function startTagConfig(el, tagName) {
  const savedHtml = el.innerHTML;
  const form = document.createElement('div');
  form.className = 'tag-config-form';
  form.innerHTML = `
    <input type="number" class="tc-ttl" placeholder="TTL hours (optional)" min="1">
    <input type="datetime-local" class="tc-expires">`;
  el.innerHTML = '';
  el.appendChild(form);

  const ttlInput = form.querySelector('.tc-ttl');
  const expiresInput = form.querySelector('.tc-expires');
  ttlInput.focus();

  let committed = false;
  async function commit() {
    if (committed) return; committed = true;
    const ttlVal = ttlInput.value.trim();
    const expiresVal = expiresInput.value;
    if (!ttlVal && !expiresVal) { cancel(); return; }
    const body = {};
    if (ttlVal) body.ttl_hours = parseInt(ttlVal, 10);
    if (expiresVal) body.expires_at = toUtcIso(expiresVal);
    try {
      await apiFetch(`/tags/${encodeURIComponent(tagName)}/config`, {
        method: 'POST', body: JSON.stringify(body),
      });
      await loadTags();
    } catch (e) { alert(`Config failed: ${e.message}`); cancel(); }
  }

  function cancel() {
    committed = true;
    el.innerHTML = savedHtml;
    el.querySelector('.tag-rename')?.addEventListener('click', ev => {
      ev.stopPropagation(); startTagRename(el, tagName);
    });
    el.querySelector('.tag-config-btn')?.addEventListener('click', ev => {
      ev.stopPropagation(); startTagConfig(el, tagName);
    });
  }

  form.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    if (e.key === 'Escape') cancel();
  });
}

async function selectTag(tag) {
  closeSidebar();
  activeTag = tag; offset = 0; total = 0;
  feed.innerHTML = '';
  loadMoreWrap.style.display = 'none';
  tagList.querySelectorAll('.tag-item').forEach(el => {
    el.classList.remove('active');
    const name = el.querySelector('.tag-name').textContent;
    if ((tag === null && name === 'all') || name === tag) el.classList.add('active');
  });
  await loadPosts(true);
  connectSSE();
}

/* ── Posts ────────────────────────────────────────────────── */
async function loadPosts(replace = false) {
  if (!apiKey) return;
  try {
    const params = new URLSearchParams({ limit: LIMIT, offset });
    if (activeTag) params.set('tag', activeTag);
    const data = await apiFetch(`/posts?${params}`);
    total = data.total;
    offset += data.items.length;

    if (replace) feed.innerHTML = '';

    if (data.items.length === 0 && offset === 0) {
      feed.innerHTML = `
        <div class="empty">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <p>No posts yet</p>
        </div>`;
    } else {
      data.items.forEach((p, i) => {
        const el = renderPost(p);
        if (replace) el.style.animationDelay = `${i * 35}ms`;
        feed.appendChild(el);
      });
    }
    loadMoreWrap.style.display = offset < total ? 'block' : 'none';
  } catch (e) {
    if (replace) feed.innerHTML = `<div class="auth-prompt"><p>Could not load posts.</p><p>${e.message}</p></div>`;
  }
}

loadMoreBtn.addEventListener('click', () => loadPosts(false));

function renderPost(post) {
  const el = document.createElement('div');
  el.className = 'post';
  el.dataset.id = post.id;

  const timeLabel  = post.updated_at
    ? `${relativeTime(post.created_at)} · edited ${relativeTime(post.updated_at)}`
    : relativeTime(post.created_at);
  const timeTitle  = post.updated_at
    ? `created ${post.created_at}\nedited ${post.updated_at}`
    : post.created_at;
  const expiresHtml = post.expires_at
    ? `<span class="post-expires">expires ${relativeTime(post.expires_at)}</span>`
    : '';
  const titleHtml = post.title ? `<div class="post-title">${escHtml(post.title)}</div>` : '';
  const tagsHtml  = post.tags.map(t => `<span class="tag-pill" data-tag="${t}">${escHtml(t)}</span>`).join('');
  const srcHtml   = post.source ? `<span class="post-source">via ${escHtml(post.source)}</span>` : '';
  const metaRow   = (tagsHtml || srcHtml) ? `<div class="post-tags">${tagsHtml}${srcHtml}</div>` : '';
  const headerHtml = (titleHtml || metaRow) ? `<div class="post-header">${titleHtml}${metaRow}</div>` : '';

  let bodyHtml;
  if (post.format === 'markdown') {
    bodyHtml = `<div class="post-body">${marked.parse(post.content)}</div>`;
  } else if (post.format === 'html') {
    bodyHtml = `<div class="post-body">${post.content}</div>`;
  } else if (post.format === 'json') {
    let pretty = post.content;
    try { pretty = JSON.stringify(JSON.parse(post.content), null, 2); } catch {}
    bodyHtml = `<div class="post-body format-json">${escHtml(pretty)}</div>`;
  } else {
    bodyHtml = `<div class="post-body format-text">${escHtml(post.content)}</div>`;
  }

  el.innerHTML = `
    ${headerHtml}
    <div class="post-body-wrap">${bodyHtml}</div>
    <div class="post-footer">
      <span class="post-time" title="${timeTitle}">${timeLabel}</span>${expiresHtml}
      <div class="post-actions">
        <button class="btn-edit">✏️ Edit</button>
        <button class="btn-delete">🗑️ Delete</button>
      </div>
    </div>`;

  el.querySelectorAll('.tag-pill').forEach(pill =>
    pill.addEventListener('click', e => { e.stopPropagation(); selectTag(pill.dataset.tag); })
  );
  el.querySelector('.btn-delete').addEventListener('click', async (e) => {
    e.stopPropagation();
    if (!confirm('Delete this post?')) return;
    try {
      await fetch(`/posts/${post.id}`, { method: 'DELETE', headers: { Authorization: `Bearer ${apiKey}` } });
      el.remove(); total--;
      loadMoreWrap.style.display = offset < total ? 'block' : 'none';
      await loadTags();
    } catch {}
  });
  el.querySelector('.btn-edit').addEventListener('click', (e) => { e.stopPropagation(); enterEditMode(el, post); });
  el.addEventListener('click', () => { if (!el.classList.contains('editing')) openPostModal(post); });
  return el;
}

function enterEditMode(el, post) {
  el.classList.add('editing');
  const savedHtml = el.innerHTML;
  el.innerHTML = `
    <div class="edit-form">
      <div><label>Title</label><input class="ef-title" type="text" value="${escHtml(post.title || '')}"></div>
      <div><label>Format</label>
        <select class="ef-format">
          <option value="markdown"${post.format==='markdown'?' selected':''}>markdown</option>
          <option value="text"${post.format==='text'?' selected':''}>text</option>
          <option value="html"${post.format==='html'?' selected':''}>html</option>
          <option value="json"${post.format==='json'?' selected':''}>json</option>
        </select>
      </div>
      <div><label>Content</label><textarea class="ef-content">${escHtml(post.content)}</textarea></div>
      <div><label>Tags</label><input class="ef-tags" type="text" value="${escHtml(post.tags.join(', '))}"></div>
      <div><label>Source</label><input class="ef-source" type="text" value="${escHtml(post.source || '')}"></div>
      <div><label>Expires</label><input class="ef-expires" type="datetime-local" value="${toDatetimeLocal(post.expires_at || '')}"></div>
      <div class="edit-actions">
        <button class="btn-cancel">Cancel</button>
        <button class="btn-save">Save</button>
      </div>
    </div>`;

  el.querySelector('.btn-cancel').addEventListener('click', () => { el.classList.remove('editing'); el.innerHTML = savedHtml; rewirePost(el, post); });
  el.querySelector('.btn-save').addEventListener('click', async () => {
    const body = {
      title:      el.querySelector('.ef-title').value.trim() || null,
      content:    el.querySelector('.ef-content').value,
      format:     el.querySelector('.ef-format').value,
      tags:       el.querySelector('.ef-tags').value.split(',').map(s => s.trim()).filter(Boolean),
      source:     el.querySelector('.ef-source').value.trim() || null,
      expires_at: toUtcIso(el.querySelector('.ef-expires').value) || null,
    };
    try {
      const updated = await apiFetch(`/posts/${post.id}`, { method: 'PATCH', body: JSON.stringify(body) });
      el.replaceWith(renderPost(updated));
      await loadTags();
    } catch (e) { alert(`Save failed: ${e.message}`); }
  });
}

function rewirePost(el, post) {
  el.querySelectorAll('.tag-pill').forEach(pill =>
    pill.addEventListener('click', e => { e.stopPropagation(); selectTag(pill.dataset.tag); })
  );
  el.querySelector('.btn-delete').addEventListener('click', async (e) => {
    e.stopPropagation();
    if (!confirm('Delete this post?')) return;
    try {
      await fetch(`/posts/${post.id}`, { method: 'DELETE', headers: { Authorization: `Bearer ${apiKey}` } });
      el.remove(); total--;
      loadMoreWrap.style.display = offset < total ? 'block' : 'none';
      await loadTags();
    } catch {}
  });
  el.querySelector('.btn-edit').addEventListener('click', (e) => { e.stopPropagation(); enterEditMode(el, post); });
}

/* ── SSE ──────────────────────────────────────────────────── */
function connectSSE() {
  if (es) { es.close(); es = null; }
  if (!apiKey) return;
  const params = new URLSearchParams({ key: apiKey });
  if (activeTag) params.set('tag', activeTag);
  es = new EventSource(`/events?${params}`);

  es.addEventListener('post', e => {
    const post = JSON.parse(e.data);
    if (feed.querySelector(`[data-id="${post.id}"]`)) return;
    const empty = feed.querySelector('.empty');
    if (empty) empty.remove();
    const el = renderPost(post);
    el.classList.add('new');
    feed.prepend(el);
    total++;
    loadTags();
  });

  es.onopen = () => {
    if (sseErrorTimer) { clearTimeout(sseErrorTimer); sseErrorTimer = null; }
    setDot('connected');
  };
  es.onerror = () => {
    if (sseErrorTimer) clearTimeout(sseErrorTimer);
    sseErrorTimer = setTimeout(() => setDot('error'), 3000);
  };
}

function setDot(state) {
  liveDot.className = 'live-dot' + (state ? ' ' + state : '');
  liveLabel.textContent = state === 'connected' ? 'live' : state === 'error' ? 'error' : 'offline';
}

/* ── Post modal ───────────────────────────────────────────── */
const postModal  = document.getElementById('postModal');
const pmBackdrop = document.getElementById('pmBackdrop');
const pmClose    = document.getElementById('pmClose');
const pmTitle    = document.getElementById('pmTitle');
const pmMeta     = document.getElementById('pmMeta');
const pmBody     = document.getElementById('pmBody');
const pmEdit     = document.getElementById('pmEdit');
const pmDelete   = document.getElementById('pmDelete');
let _modalPost   = null;

function openPostModal(post) {
  _modalPost = post;
  pmTitle.textContent = post.title || '';
  pmTitle.style.display = post.title ? '' : 'none';

  const tagsHtml  = post.tags.map(t => `<span class="tag-pill" data-tag="${t}">${escHtml(t)}</span>`).join('');
  const srcHtml   = post.source ? `<span class="post-source">via ${escHtml(post.source)}</span>` : '';
  const timeLabel = post.updated_at
    ? `${relativeTime(post.created_at)} · edited ${relativeTime(post.updated_at)}`
    : relativeTime(post.created_at);
  const pmExpiresHtml = post.expires_at
    ? `<div class="pm-time">expires ${relativeTime(post.expires_at)}</div>`
    : '';
  pmMeta.innerHTML = (tagsHtml || srcHtml)
    ? `<div class="post-tags">${tagsHtml}${srcHtml}</div><div class="pm-time">${timeLabel}</div>${pmExpiresHtml}`
    : `<div class="pm-time">${timeLabel}</div>${pmExpiresHtml}`;
  pmMeta.querySelectorAll('.tag-pill').forEach(pill =>
    pill.addEventListener('click', e => { e.stopPropagation(); closePostModal(); selectTag(pill.dataset.tag); })
  );

  if (post.format === 'markdown') {
    pmBody.innerHTML = `<div class="post-body">${marked.parse(post.content)}</div>`;
  } else if (post.format === 'html') {
    pmBody.innerHTML = `<div class="post-body">${post.content}</div>`;
  } else if (post.format === 'json') {
    let pretty = post.content;
    try { pretty = JSON.stringify(JSON.parse(post.content), null, 2); } catch {}
    pmBody.innerHTML = `<div class="post-body format-json">${escHtml(pretty)}</div>`;
  } else {
    pmBody.innerHTML = `<div class="post-body format-text">${escHtml(post.content)}</div>`;
  }

  postModal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closePostModal() {
  postModal.classList.remove('open');
  document.body.style.overflow = '';
  pmBody.innerHTML = '';
  _modalPost = null;
}

pmClose.addEventListener('click', closePostModal);
pmBackdrop.addEventListener('click', closePostModal);
pmEdit.addEventListener('click', () => {
  const post = _modalPost; if (!post) return;
  closePostModal();
  const card = feed.querySelector(`[data-id="${post.id}"]`);
  if (card) enterEditMode(card, post);
});
pmDelete.addEventListener('click', async () => {
  const post = _modalPost; if (!post) return;
  if (!confirm('Delete this post?')) return;
  try {
    await fetch(`/posts/${post.id}`, { method: 'DELETE', headers: { Authorization: `Bearer ${apiKey}` } });
    closePostModal();
    const card = feed.querySelector(`[data-id="${post.id}"]`);
    if (card) { card.remove(); total--; }
    loadMoreWrap.style.display = offset < total ? 'block' : 'none';
    await loadTags();
  } catch {}
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && postModal.classList.contains('open')) closePostModal();
});

/* ── Helpers ──────────────────────────────────────────────── */
function relativeTime(iso) {
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (Math.abs(s) < 60)    return s < 0 ? 'in a moment' : 'just now';
  if (Math.abs(s) < 3600)  return s < 0 ? `in ${Math.floor(-s/60)}m` : `${Math.floor(s/60)}m ago`;
  if (Math.abs(s) < 86400) return s < 0 ? `in ${Math.floor(-s/3600)}h` : `${Math.floor(s/3600)}h ago`;
  return s < 0 ? `in ${Math.floor(-s/86400)}d` : `${Math.floor(s/86400)}d ago`;
}

function toUtcIso(localDatetimeStr) {
  if (!localDatetimeStr) return '';
  const d = new Date(localDatetimeStr);
  if (isNaN(d.getTime())) return '';
  return d.toISOString().replace(/\.\d{3}Z$/, 'Z');
}

function toDatetimeLocal(utcIso) {
  if (!utcIso) return '';
  const d = new Date(utcIso);
  if (isNaN(d.getTime())) return '';
  // Format as YYYY-MM-DDTHH:MM in local time for datetime-local input
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
</script>
