<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Relay</title>
  <script>
    // Apply the saved theme before first paint to avoid a flash. Still the only
    // inline script, and it must stay that way — it cannot move without a flash.
    // 'dark' is the bare :root block, so it is represented by *no* attribute:
    // an absent or unrecognised value then degrades to a complete theme rather
    // than an unstyled page. The pattern guard keeps a hand-edited localStorage
    // from stamping arbitrary text into an attribute selector.
    (function () {
      try {
        var t = localStorage.getItem('relay-theme');
        if (t && t !== 'dark' && /^[a-z0-9-]{1,32}$/.test(t))
          document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="/assets/relay-favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/assets/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="/assets/favicon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@14.1.4/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.5/dist/purify.min.js"></script>
  <link rel="stylesheet" href="/static/__ASSETS__/app.css">
</head>
<body>

<header>
  <button class="collapse-btn" id="collapseBtn" aria-label="Collapse sidebar" title="Collapse sidebar" style="display:none">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="12" height="10" rx="1.5"></rect>
      <line x1="6" y1="3" x2="6" y2="13"></line>
    </svg>
  </button>
  <img class="brand-mark" src="/assets/relay-mark-on-dark.svg" alt="Relay" width="20" height="20">
  <h1 class="brand-name">Relay</h1>
  <span class="brand-sep">·</span>
  <div class="live-indicator">
    <span class="live-dot" id="liveDot"></span>
    <span class="live-label" id="liveLabel">offline</span>
  </div>
  <button class="menu-btn" id="menuBtn" aria-label="Toggle tags">
    <span></span><span></span><span></span>
  </button>
  <div class="header-right">
    <!-- Order matters: the primary action leads, and the two icon buttons sit
         between it and Disconnect. "+ New Post" next to a one-click session
         kill is a misfire waiting to happen — pinned by
         test_header_controls_are_one_visual_set. -->
    <button class="btn-new-post" id="newPostBtn" style="display:none">+ New Post</button>
    <div class="theme-picker">
      <!-- A palette, not a sun/moon: this stopped being a two-state toggle when it
           became a menu, and a glyph that flips between ☀ and ☾ promises the wrong
           interaction. Drawn rather than typed for the reason the tag row is —
           see the ICON_PENCIL note in main.js. -->
      <button class="icon-btn" id="themeBtn" aria-label="Theme" title="Theme"
              aria-haspopup="menu" aria-expanded="false" aria-controls="themeMenu">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M8 1.6c-3.5 0-6.4 2.9-6.4 6.4S4.5 14.4 8 14.4c.72 0 1.3-.58 1.3-1.3 0-.31-.12-.6-.31-.82a1.3 1.3 0 0 1 .97-2.16h1.53a3.91 3.91 0 0 0 3.91-3.91C15.4 3.42 12.1 1.6 8 1.6Z"/>
          <circle cx="4.6" cy="8.3" r=".85" fill="currentColor" stroke="none"/>
          <circle cx="6.3" cy="5.2" r=".85" fill="currentColor" stroke="none"/>
          <circle cx="9.8" cy="4.8" r=".85" fill="currentColor" stroke="none"/>
          <circle cx="12.1" cy="7.1" r=".85" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <div class="theme-menu" id="themeMenu" role="menu" aria-label="Theme"></div>
    </div>
    <button class="icon-btn" id="statusBtn" aria-label="Server status" title="Server status" style="display:none">
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="8" cy="8" r="6.4"/><path d="M8 7.3v3.9"/>
        <circle cx="8" cy="4.9" r=".85" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <div class="connected-bar" id="connectedBar" style="display:none">
      <!-- Was the word "disconnect" in muted text — the only control in the row
           without a shape, so it read as a footnote rather than a button. -->
      <button class="icon-btn icon-btn-danger" id="disconnectBtn"
              aria-label="Disconnect" title="Disconnect — end this session">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M8 2v5.3"/><path d="M11.9 4.4a5.5 5.5 0 1 1-7.8 0"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="layout">
  <aside id="sidebarEl">
    <div class="sidebar-header">
      <div class="sidebar-tabs">
        <button class="sb-tab active" id="tabTags">Tags</button>
        <button class="sb-tab" id="tabTree">Tree</button>
        <button class="sb-tab" id="tabFiles">Files</button>
        <button class="sb-tab" id="tabDeleted" title="Deleted posts you can restore">Deleted</button>
      </div>
      <button class="sidebar-add-btn" id="newTagBtn" title="New tag" style="display:none">+</button>
    </div>
    <div class="tag-new" id="tagNew" style="display:none">
      <input class="tag-new-input" id="tagNewInput" placeholder="tag name" autocomplete="off">
    </div>
    <div class="tag-list" id="tagList"></div>
  </aside>

  <main>
    <div class="login-view" id="loginView" style="display:none">
      <div class="login-card">
        <img class="login-mark" src="/assets/relay-mark-on-dark.svg" alt="" width="56" height="56">
        <h2 class="login-title">Relay</h2>
        <p class="login-tag">Your personal knowledge base</p>
        <div class="oidc-login" id="oidcLogin" style="display:none">
          <button class="btn-login-primary" id="oidcLoginBtn" type="button">Log in</button>
          <button class="link-btn" id="useKeyBtn" type="button">use an API key instead</button>
        </div>
        <form class="key-wrap login-key" id="connectForm" style="display:none">
          <input type="text" id="apiUserInput" autocomplete="username" value="relay"
                 aria-hidden="true" tabindex="-1"
                 style="position:absolute;width:1px;height:1px;padding:0;border:0;opacity:0;pointer-events:none">
          <input type="password" id="apiKeyInput" placeholder="API key" autocomplete="current-password" name="password">
          <button class="btn-connect" id="connectBtn" type="submit">Connect</button>
        </form>
      </div>
    </div>
    <div class="compose-panel" id="composePanel">
      <div class="post">
        <div class="edit-form">
          <div><label for="cpTitle">Title</label><input type="text" id="cpTitle" placeholder="(required — becomes the filename)"></div>
          <div><label for="cpContent">Content</label><textarea id="cpContent" placeholder="Write something… (drop, paste, or attach a file)"></textarea>
            <div class="attach-row">
              <input type="file" id="cpFile" multiple style="display:none">
              <button type="button" class="btn-attach" id="cpAttach">📎 Attach</button>
              <span class="attach-status" id="cpAttachStatus"></span>
            </div>
          </div>
          <div><label for="cpTags">Tags</label><input type="text" id="cpTags" placeholder="comma-separated"></div>
          <div><label for="cpSource">Source</label><input type="text" id="cpSource" placeholder="(optional)"></div>
          <div><label for="cpExpires">Expires</label><input type="datetime-local" id="cpExpires"></div>
          <div class="edit-actions">
            <button class="btn-cancel" id="cpCancel">Cancel</button>
            <button class="btn-save" id="cpPublish">Publish</button>
          </div>
        </div>
      </div>
    </div>

    <div class="search-bar" id="searchBar" style="display:none">
      <span class="search-label">search</span>
      <input type="text" id="searchInput" aria-label="Search posts"
             placeholder="Search title, content, source…" autocomplete="off">
      <button class="search-clear" id="searchClear" title="Clear search">×</button>
      <div class="sort-control" id="sortControl">
        <select class="sort-select" id="sortField" title="Sort by" aria-label="Sort by">
          <option value="updated">Updated</option>
          <option value="created">Created</option>
        </select>
        <button class="vt-btn sort-dir" id="sortDir" title="Sort direction" aria-label="Sort direction">↓</button>
      </div>
      <div class="view-toggle" id="viewToggle">
        <button class="vt-btn active" id="vtList" title="List view" aria-label="List view">☰</button>
        <button class="vt-btn" id="vtGrid" title="Grid view" aria-label="Grid view">▦</button>
      </div>
    </div>

    <button class="new-posts-pill" id="newPostsPill" style="display:none">
      <span class="np-arrow">↑</span> <span id="newPostsLabel">new posts</span>
    </button>

    <div class="feed" id="feed"></div>

    <div class="load-more" id="loadMore" style="display:none">
      <button id="loadMoreBtn">Load more</button>
    </div>

    <div class="attachments-view" id="attachmentsView" style="display:none"></div>
    <div class="attachments-view deleted-view" id="deletedView" style="display:none"></div>
  </main>

  <div class="lightbox" id="lightbox" style="display:none">
    <div class="lightbox-inner">
      <img id="lightboxImg" alt="">
      <div class="lightbox-cap" id="lightboxCap"></div>
    </div>
  </div>
</div>

<div class="status-modal" id="editModal">
  <div class="pm-backdrop" id="emBackdrop"></div>
  <div class="sm-inner em-inner">
    <div class="sm-head">
      <span class="sm-name">Edit</span>
      <span class="sm-version" id="emTitle"></span>
      <button class="sm-close" id="emClose" aria-label="Close">&times;</button>
    </div>
    <div class="sm-body" id="emBody"></div>
  </div>
</div>

<div class="status-modal" id="historyModal">
  <div class="pm-backdrop" id="hmBackdrop"></div>
  <div class="sm-inner hm-inner">
    <div class="sm-head">
      <span class="sm-name">History</span>
      <span class="sm-version" id="hmTitle"></span>
      <button class="sm-close" id="hmClose" aria-label="Close">&times;</button>
    </div>
    <div class="sm-body" id="hmBody"></div>
  </div>
</div>

<div class="status-modal" id="statusModal">
  <div class="pm-backdrop" id="smBackdrop"></div>
  <div class="sm-inner">
    <div class="sm-head">
      <span class="sm-name">Relay</span>
      <span class="sm-version" id="smVersion"></span>
      <button class="sm-close" id="smClose" aria-label="Close">&times;</button>
    </div>
    <div class="sm-body" id="smBody"></div>
  </div>
</div>

<div class="post-modal" id="postModal">
  <div class="pm-backdrop" id="pmBackdrop"></div>
  <div class="pm-inner">
    <div class="pm-header">
      <button class="pm-back" id="pmBack">← back</button>
      <span class="pm-title" id="pmTitle"></span>
      <button class="pm-close" id="pmClose">×</button>
    </div>
    <div class="pm-meta" id="pmMeta"></div>
    <div class="pm-body-wrap">
      <div class="pm-body" id="pmBody"></div>
      <div class="pm-body-fade" id="pmBodyFade"></div>
    </div>
    <div class="pm-footer">
      <button class="btn-edit" id="pmHistory">🕑 History</button>
      <button class="btn-edit" id="pmEdit">✏️ Edit</button>
      <button class="btn-delete" id="pmDelete">🗑️ Delete</button>
    </div>
  </div>
</div>

<script type="module" src="/static/__ASSETS__/js/main.js"></script>
</body>
</html>
