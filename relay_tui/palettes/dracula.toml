# tuidash colour palette — Dracula (Zeno Rocha)
# ────────────────────────────────────────────────────────────
# Select with:  TUIDASH_PALETTE=dracula

# ── Core palette ─────────────────────────────────────────────────────────────
primary = "#bd93f9"   # dracula purple  — border titles, clock, nav arrows, accents
border  = "#44475a"   # current line    — widget / button borders
bg      = "#282a36"   # background      — header & footer background

# ── Progress bar gradient (left → right as bar fills) ────────────────────────
bar_low  = "#50fa7b"  # dracula green  — 0 – 60 % of bar width
bar_mid  = "#f1fa8c"  # dracula yellow — 60 – 80 % of bar width
bar_high = "#ff5555"  # dracula red    — 80 – 100 % of bar width
bar_bg   = "#3a3c4e"  # dim comment    — unfilled bar background

# ── Performance heatmap ───────────────────────────────────────────────────────
perf_great    = "#50fa7b"  # green   — > +10 %
perf_good     = "#8be9fd"  # cyan    —   0 to +10 %
perf_flat     = "#bd93f9"  # purple  —  −5 to   0 %
perf_bad      = "#f1fa8c"  # yellow  — −10 to  −5 %
perf_poor     = "#ffb86c"  # orange  — −20 to −10 %
perf_terrible = "#ff5555"  # red     — < −20 %
