# One Dark (Atom)
# Matches the "One Dark" theme from the web UI; see its app.css block.
# Select with: RELAY_PALETTE=one-dark

# ── Core ──────────────────────────────────────────────────────────────────────
primary = "#61afef"   # blue          — accent, interactive elements, borders
border  = "#3e4451"   # selection     — widget borders, badges, panel separators
bg      = "#21252b"   # UI chrome     — screen, header, footer background

# ── Semantic colours ───────────────────────────────────────────────────────────
# Used for TTL expiry badges (post_panel) and Textual's success/warning/error
# theme tokens (notifications, buttons).
perf_great    = "#98c379"  # success / far-future expiry
perf_bad      = "#e5c07b"  # warning / expiry within 3 days
perf_terrible = "#e06c75"  # error / expired / expiry within 24h
