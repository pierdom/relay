# tuidash colour palette — Tango (GNOME / freedesktop.org)
# ────────────────────────────────────────────────────────────
# Select with:  TUIDASH_PALETTE=tango

# ── Core palette ─────────────────────────────────────────────────────────────
primary = "#729fcf"   # sky blue 1      — border titles, clock, nav arrows, accents
border  = "#555753"   # aluminium 4     — widget / button borders
bg      = "#2e3436"   # aluminium 6     — header & footer background

# ── Progress bar gradient (left → right as bar fills) ────────────────────────
bar_low  = "#73d216"  # chameleon 2 (green) — 0 – 60 % of bar width
bar_mid  = "#edd400"  # butter 2 (yellow)   — 60 – 80 % of bar width
bar_high = "#cc0000"  # scarlet red 2       — 80 – 100 % of bar width
bar_bg   = "#42464a"  # aluminium 5         — unfilled bar background

# ── Performance heatmap ───────────────────────────────────────────────────────
perf_great    = "#73d216"  # chameleon green  — > +10 %
perf_good     = "#729fcf"  # sky blue         —   0 to +10 %
perf_flat     = "#34e2e2"  # cyan             —  −5 to   0 %
perf_bad      = "#edd400"  # butter yellow    — −10 to  −5 %
perf_poor     = "#f57900"  # tangerine orange — −20 to −10 %
perf_terrible = "#cc0000"  # scarlet red      — < −20 %
