# Relay Dark — default TUI palette
# Matches the "Relay Dark" theme from the web UI.
# Override with: RELAY_PALETTE=<stem>  (or point it at an absolute path)

# ── Core ──────────────────────────────────────────────────────────────────────
primary = "#f59e0b"   # amber        — accent, interactive elements, borders
border  = "#1d2230"   # blue-grey    — widget borders, badges, panel separators
bg      = "#090a0d"   # near-black   — screen, header, footer background

# ── Semantic colours ───────────────────────────────────────────────────────────
# Used for TTL expiry badges (post_panel) and Textual's success/warning/error
# theme tokens (notifications, buttons).
perf_great    = "#10b981"  # green         — success / far-future expiry
perf_good     = "#10b981"  # green
perf_flat     = "#f59e0b"  # amber         — neutral
perf_bad      = "#d97706"  # amber-dim     — warning / expiry within 3 days
perf_poor     = "#f87171"  # red
perf_terrible = "#f87171"  # red           — error / expired / expiry within 24h
