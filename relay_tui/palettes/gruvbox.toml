# tuidash colour palette — Gruvbox Dark (morhetz)
# ────────────────────────────────────────────────────────────
# Select with:  TUIDASH_PALETTE=gruvbox

# ── Core palette ─────────────────────────────────────────────────────────────
primary = "#fabd2f"   # gruvbox yellow  — border titles, clock, nav arrows, accents
border  = "#504945"   # bg3             — widget / button borders
bg      = "#1d2021"   # bg0_h (hard)    — header & footer background

# ── Progress bar gradient (left → right as bar fills) ────────────────────────
bar_low  = "#b8bb26"  # bright green — 0 – 60 % of bar width
bar_mid  = "#fabd2f"  # bright yellow — 60 – 80 % of bar width
bar_high = "#fb4934"  # bright red    — 80 – 100 % of bar width
bar_bg   = "#3c3836"  # bg2           — unfilled bar background

# ── Performance heatmap ───────────────────────────────────────────────────────
perf_great    = "#b8bb26"  # bright green  — > +10 %
perf_good     = "#8ec07c"  # bright aqua   —   0 to +10 %
perf_flat     = "#83a598"  # bright blue   —  −5 to   0 %
perf_bad      = "#fabd2f"  # bright yellow — −10 to  −5 %
perf_poor     = "#fe8019"  # bright orange — −20 to −10 %
perf_terrible = "#fb4934"  # bright red    — < −20 %
