# Gruvbox Dark — morhetz
# Matches the "Gruvbox" theme from the web UI.
# Select with: RELAY_PALETTE=gruvbox

# ── Core ──────────────────────────────────────────────────────────────────────
primary = "#fabd2f"   # bright yellow  — accent / interactive
border  = "#504945"   # bg2            — widget borders, badges, panel separators
bg      = "#1d2021"   # bg0_h (hard)   — screen, header, footer background

# ── Semantic colours ───────────────────────────────────────────────────────────
perf_great    = "#b8bb26"  # bright green    — success / far-future expiry
perf_bad      = "#d79921"  # neutral yellow  — warning / expiry within 3 days
perf_terrible = "#fb4934"  # bright red      — error / expired / expiry within 24h
