# tuidash colour palette — earthy (warm terracotta and sandstone)
# ──────────────────────────────────────────────────────────────
# Values are either hex colours (#rrggbb) or Rich colour names
# (e.g. bright_green, cyan, red, bold red, …).
#
# Select this palette with:  TUIDASH_PALETTE=earthy

# ── Core palette ─────────────────────────────────────────────────────────────
primary = "#c8a96e"   # warm amber/sandstone — border titles, clock, nav arrows, accents
border  = "#5c4427"   # dark bark brown      — widget / button borders
bg      = "#1a1208"   # very dark rich brown — header & footer background

# ── Progress bar gradient (left → right as bar fills) ────────────────────────

# ── Performance heatmap (Ghostfolio stat cells) ───────────────────────────────
perf_great    = "#7a9e4e"  # sage green   — > +10 %
perf_bad      = "#c8a96e"  # amber        — −10 to  −5 %
perf_terrible = "#8b2a1a"  # deep rust    — < −20 %
