# earthy (warm terracotta and sandstone)
# A TUI-only palette — no browser UI theme counterpart.
# Select with: RELAY_PALETTE=earthy

# ── Core ──────────────────────────────────────────────────────────────────────
primary = "#c8a96e"   # warm amber/sandstone — accent, interactive elements, borders
border  = "#5c4427"   # dark bark brown — widget borders, badges, panel separators
bg      = "#1a1208"   # very dark rich brown — screen, header, footer background

# ── Semantic colours ───────────────────────────────────────────────────────────
# Used for TTL expiry badges (post_panel) and Textual's success/warning/error
# theme tokens (notifications, buttons).
perf_great    = "#7a9e4e"  # success / far-future expiry
perf_bad      = "#c8a96e"  # warning / expiry within 3 days
perf_terrible = "#8b2a1a"  # error / expired / expiry within 24h
