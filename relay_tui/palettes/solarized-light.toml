# Solarized Light (Ethan Schoonover)
# Matches the "Solarized Light" theme from the web UI.
# Select with: RELAY_PALETTE=solarized-light
#
# Same accent as Solarized Dark — Solarized's eight accent colours are
# engineered to read on either background, so nothing about the accent set
# changes here. Only `border`/`bg` move to the palette's light tones: `border`
# is base01 (shared with Dark — Solarized reuses it as-is on both), `bg` is
# base2. See app.css's Solarized Light block for the full rationale.

# ── Core ──────────────────────────────────────────────────────────────────────
primary = "#268bd2"   # blue          — accent, interactive elements, borders
border  = "#586e75"   # base01        — widget borders, badges, panel separators
bg      = "#eee8d5"   # base2         — screen, header, footer background

# ── Semantic colours ───────────────────────────────────────────────────────────
# Used for TTL expiry badges (post_panel) and Textual's success/warning/error
# theme tokens (notifications, buttons).
perf_great    = "#859900"  # success / far-future expiry
perf_bad      = "#b58900"  # warning / expiry within 3 days
perf_terrible = "#dc322f"  # error / expired / expiry within 24h
