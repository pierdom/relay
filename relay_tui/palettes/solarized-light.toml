# Solarized Light (Ethan Schoonover)
# Matches the "Solarized Light" theme from the web UI.
# Select with: RELAY_PALETTE=solarized-light
#
# Same accent as Solarized Dark — Solarized's eight accent colours are
# engineered to read on either background, so nothing about the accent set
# changes here. Only `border`/`bg` move to the palette's light tones: `border`
# is base01 (shared with Dark — Solarized reuses it as-is on both), `bg` is
# base2. See app.css's Solarized Light block for the full rationale.

# ── Core palette ─────────────────────────────────────────────────────────────
primary = "#268bd2"   # blue   — border titles, clock, nav arrows, accents
border  = "#586e75"   # base01 — widget / button borders
bg      = "#eee8d5"   # base2  — header & footer background

# ── Progress bar gradient (left → right as bar fills) ────────────────────────
bar_low  = "#859900"  # green  — 0 – 60 % of bar width
bar_mid  = "#b58900"  # yellow — 60 – 80 % of bar width
bar_high = "#dc322f"  # red    — 80 – 100 % of bar width
bar_bg   = "#93a1a1"  # base1  — unfilled bar background

# ── Performance heatmap ───────────────────────────────────────────────────────
perf_great    = "#859900"  # green   — > +10 %
perf_good     = "#2aa198"  # cyan    —   0 to +10 %
perf_flat     = "#268bd2"  # blue    —  −5 to   0 %
perf_bad      = "#b58900"  # yellow  — −10 to  −5 %
perf_poor     = "#cb4b16"  # orange  — −20 to −10 %
perf_terrible = "#dc322f"  # red     — < −20 %
