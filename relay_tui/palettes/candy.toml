# candy (bold neon sweets)
# A TUI-only palette — no browser UI theme counterpart.
# Select with: RELAY_PALETTE=candy

# ── Core ──────────────────────────────────────────────────────────────────────
primary = "#ff4dd2"   # hot pink      — accent, interactive elements, borders
border  = "#7a1a6e"   # deep magenta  — widget borders, badges, panel separators
bg      = "#150010"   # near-black purple — screen, header, footer background

# ── Semantic colours ───────────────────────────────────────────────────────────
# Used for TTL expiry badges (post_panel) and Textual's success/warning/error
# theme tokens (notifications, buttons).
perf_great    = "#4dff91"  # success / far-future expiry
perf_bad      = "#ffdd00"  # warning / expiry within 3 days
perf_terrible = "#ff2255"  # error / expired / expiry within 24h
