# Solarized Dark (Ethan Schoonover)
# Matches the "Solarized Dark" theme from the web UI.
# Select with: RELAY_PALETTE=solarized
#
# Accent is blue, not cyan: `--on-accent` (black) only clears the accessibility
# floor at 4.5:1 or better, and blue is the brightest of Solarized's accents
# that black text still reads well on (5.71:1) — violet, magenta and orange
# all fall under 4.5:1 there. See app.css's Solarized block for the full
# rationale. `border` is base02, matching the web's `--border`: base01 framed
# every card at 2.4:1, harsher than any other theme.

# ── Core ──────────────────────────────────────────────────────────────────────
primary = "#268bd2"   # blue          — accent, interactive elements, borders
border  = "#073642"   # base02        — widget borders, badges, panel separators
bg      = "#002b36"   # base03        — screen, header, footer background

# ── Semantic colours ───────────────────────────────────────────────────────────
# Used for TTL expiry badges (post_panel) and Textual's success/warning/error
# theme tokens (notifications, buttons).
perf_great    = "#859900"  # success / far-future expiry
perf_bad      = "#b58900"  # warning / expiry within 3 days
perf_terrible = "#dc322f"  # error / expired / expiry within 24h
