# Solarized Dark (Ethan Schoonover)
# Matches the "Solarized Dark" theme from the web UI.
# Select with: RELAY_PALETTE=solarized
#
# Accent is blue, not cyan: `--on-accent` (black) only clears the accessibility
# floor at 4.5:1 or better, and blue is the brightest of Solarized's accents
# that black text still reads well on (5.71:1) — violet, magenta and orange
# all fall under 4.5:1 there. See app.css's Solarized block for the full
# rationale. `border` is base01, matching the web's `--border` — base02 (the
# old value here) is the web's `--surface`, one step lighter.

# ── Core palette ─────────────────────────────────────────────────────────────
primary = "#268bd2"   # blue   — border titles, clock, nav arrows, accents
border  = "#586e75"   # base01 — widget / button borders
bg      = "#002b36"   # base03 — header & footer background

# ── Progress bar gradient (left → right as bar fills) ────────────────────────

# ── Performance heatmap ───────────────────────────────────────────────────────
perf_great    = "#859900"  # green   — > +10 %
perf_bad      = "#b58900"  # yellow  — −10 to  −5 %
perf_terrible = "#dc322f"  # red     — < −20 %
