# pastel (soft lavender and muted rainbow)
# A TUI-only palette — no browser UI theme counterpart.
# Select with: RELAY_PALETTE=pastel

# ── Core ──────────────────────────────────────────────────────────────────────
primary = "#c9a0dc"   # soft lavender — accent, interactive elements, borders
border  = "#6b4f8a"   # muted violet  — widget borders, badges, panel separators
bg      = "#13101c"   # very dark violet — screen, header, footer background

# ── Semantic colours ───────────────────────────────────────────────────────────
# Used for TTL expiry badges (post_panel) and Textual's success/warning/error
# theme tokens (notifications, buttons).
perf_great    = "#8ecf9e"  # success / far-future expiry
perf_bad      = "#f0d090"  # warning / expiry within 3 days
perf_terrible = "#f09090"  # error / expired / expiry within 24h
