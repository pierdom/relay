# tuidash colour palette — Molokai (Tomas Restrepo)
# ────────────────────────────────────────────────────────────
# Select with:  TUIDASH_PALETTE=molokai

# ── Core palette ─────────────────────────────────────────────────────────────
primary = "#a6e22e"   # molokai green   — border titles, clock, nav arrows, accents
border  = "#272822"   # background dark — widget / button borders
bg      = "#1b1d1e"   # background      — header & footer background

# ── Progress bar gradient (left → right as bar fills) ────────────────────────
bar_low  = "#a6e22e"  # lime green — 0 – 60 % of bar width
bar_mid  = "#e6db74"  # yellow     — 60 – 80 % of bar width
bar_high = "#f92672"  # pink red   — 80 – 100 % of bar width
bar_bg   = "#2d2e27"  # dim bg     — unfilled bar background

# ── Performance heatmap ───────────────────────────────────────────────────────
perf_great    = "#a6e22e"  # lime green — > +10 %
perf_good     = "#66d9e8"  # cyan       —   0 to +10 %
perf_flat     = "#ae81ff"  # violet     —  −5 to   0 %
perf_bad      = "#e6db74"  # yellow     — −10 to  −5 %
perf_poor     = "#fd971f"  # orange     — −20 to −10 %
perf_terrible = "#f92672"  # pink red   — < −20 %
