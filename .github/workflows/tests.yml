name: Tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # setup-uv stopped publishing major/minor tags at v8 (supply-chain
      # hardening), so `@v10` does not resolve — pin the full release tag.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      # The browser smokes (tests/ui) drive the real UI in Chromium. Without this
      # they skip rather than fail, so a missing browser would silently lose
      # coverage of the least-tested file in the repo — install it explicitly.
      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      - name: Test
        run: uv run pytest -q
