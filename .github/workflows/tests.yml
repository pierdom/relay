name: Tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # setup-uv stopped publishing major/minor tags at v8 (supply-chain
      # hardening), so `@v10` does not resolve — pin the full release tag.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      # relay #313 Phase 5. `pip-audit` was already a dev dependency but had to be
      # remembered by hand, so nothing ran it between audits — and the migration to
      # fastmcp pulled in `diskcache`, which had a pickle-deserialization RCE
      # (PYSEC-2026-2447) with no fixed release, holding OAuth tokens inside the
      # vault. A human noticed; CI should have. This is the "plan for staying
      # current" that phase called for, and it matters more than usual for an
      # internet-exposed OAuth surface whose library has shipped two real CVEs in
      # months. Advisories appear for reasons unrelated to our commits, so this is
      # `continue-on-error`: a new advisory should show up as a loud annotation on
      # the next push, not block an unrelated PR on someone else's disclosure.
      - name: Audit dependencies
        run: uv run pip-audit --progress-spinner off
        continue-on-error: true

      # The browser smokes (tests/ui) drive the real UI in Chromium. Without this
      # they skip rather than fail, so a missing browser would silently lose
      # coverage of the least-tested file in the repo — install it explicitly.
      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      - name: Test
        run: uv run pytest -q
